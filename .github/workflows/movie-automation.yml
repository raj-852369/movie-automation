name: Movie Automation

# GitHub ke free server par movie process karo.
# Ek baar Run dabao, tab band kar do — output seedha Google Drive me
# ek hi file (movie_processed.mp4) ke roop me aa jayega. Koi parts
# nahi, koi join nahi.
#
# Drive connect karne ke 2 tareeke hain:
#   Tareeka 1 (rclone): secret RCLONE_CONFIG
#   Tareeka 2 (service account): secrets GDRIVE_SA_JSON + GDRIVE_FOLDER_ID
#
# YouTube download ke liye (agar "Sign in to confirm you're not a bot"
# aaye): secret YOUTUBE_COOKIES — apne browser se export ki hui
# cookies.txt ka poora text.
#
# IMPORTANT: GitHub `secrets` ko step ke `if:` me use karne nahi
# deta (error: "Unrecognized named-value: 'secrets'"). Isliye neeche
# secrets ko pehle job ke `env:` me daala gaya hai (HAS_COOKIES,
# HAS_SA, HAS_RCLONE), aur steps sirf `env.HAS_...` par check karte
# hain. `if:` wali lines me kabhi `secrets.` mat likho.

on:
  workflow_dispatch:
    inputs:
      movie_url:
        description: "Movie ka YouTube link"
        required: true
        type: string
      overlay_url:
        description: "Overlay clip ka YouTube link"
        required: true
        type: string
      test_only:
        description: "Sirf 6 minute ka test chalao (pehli baar ke liye)"
        required: false
        default: false
        type: boolean

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HAS_COOKIES: ${{ secrets.YOUTUBE_COOKIES != '' }}
      HAS_SA: ${{ secrets.GDRIVE_SA_JSON != '' }}
      HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
    steps:
      - name: Files lao (repo se script)
        uses: actions/checkout@v4

      - name: ffmpeg check karo (na ho to install karo)
        run: |
          which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: yt-dlp install karo
        run: |
          pip install -q yt-dlp
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: YouTube cookies tayyar karo (agar secret hai)
        if: ${{ env.HAS_COOKIES == 'true' }}
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: printf '%s' "$YT_COOKIES" > cookies.txt

      - name: Movie aur overlay download karo
        run: |
          args=()
          [ -f cookies.txt ] && args+=(--cookies cookies.txt)
          # EJS solver: YouTube ke "n challenge" (JS challenge) ko solve
          # karne ke liye chahiye — bina iske formats hi nahi milte
          # ("Only images are available" / "Requested format is not
          # available"). Agar pehla tareeka fail ho to android client
          # se automatic dobara try karta hai.
          download() {
            local url="$1" out="$2"
            if yt-dlp --no-playlist --retries 3 "${args[@]}" --remote-components ejs:github -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o "$out" "$url"; then
              return 0
            fi
            echo "Pehla tareeka fail — android client se dobara try kar raha hoon..."
            yt-dlp --no-playlist --retries 3 "${args[@]}" --remote-components ejs:github --extractor-args "youtube:player_client=android" -f "bv*[height<=1080]+ba/b[height<=1080]" --merge-output-format mp4 -o "$out" "$url"
          }
          download "${{ inputs.movie_url }}" movie.mp4
          download "${{ inputs.overlay_url }}" overlay.mp4
          ls -lh movie.mp4 overlay.mp4

      - name: Movie process karo
        run: |
          if [ "${{ inputs.test_only }}" = "true" ]; then
            ffmpeg -y -v error -ss 0 -t 360 -i movie.mp4 -c copy test_movie.mp4
            python3 movie_automation.py test_movie.mp4 overlay.mp4 -o test_processed.mp4 --preset veryfast
            cp test_processed.mp4 movie_processed.mp4
          else
            python3 movie_automation.py movie.mp4 overlay.mp4 -o movie_processed.mp4 --preset veryfast
          fi
          ls -lh movie_processed.mp4

      - name: rclone install karo
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Google Drive connect karo (service account)
        if: ${{ env.HAS_SA == 'true' }}
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$SA_JSON" > sa.json
          printf '[gdrive]\ntype = drive\nscope = drive\nservice_account_file = sa.json\nroot_folder_id = %s\n' "$FOLDER_ID" > ~/.config/rclone/rclone.conf
          echo "UPLOAD_TARGET=gdrive:/" >> "$GITHUB_ENV"
          rclone lsd gdrive: --max-depth 1

      - name: Google Drive connect karo (rclone config)
        if: ${{ env.HAS_SA != 'true' && env.HAS_RCLONE == 'true' }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "UPLOAD_TARGET=gdrive:MovieEdit/" >> "$GITHUB_ENV"
          rclone lsd gdrive: --max-depth 1

      - name: Output Drive me upload karo (ek hi file)
        run: |
          if [ -z "$UPLOAD_TARGET" ]; then echo "Drive connect nahi hua — GDRIVE_SA_JSON + GDRIVE_FOLDER_ID ya RCLONE_CONFIG secret check karo."; exit 1; fi
          rclone copy movie_processed.mp4 "$UPLOAD_TARGET" --retries 3

      - name: Server se sab delete karo
        run: |
          rm -f movie.mp4 overlay.mp4 test_movie.mp4 test_processed.mp4 movie_processed.mp4 sa.json cookies.txt
          ls -la
          echo "Server se movie, overlay aur output sab delete kar diye."
