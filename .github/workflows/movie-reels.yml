name: Movie Reels

# Sirf Reels banao — poori movie dobara process nahi hoti.
# Drive me pehle se maujood movie_processed.mp4 ko download karke
# uske 9:16 vertical Reels banao (2-2 minute ke parts, bina kaale
# bars ke) aur wapas Drive ke MovieEdit/reels/ folder me upload karo.
# Is run me takreeban 1.5–2 ghante lagte hain.
#
# "Movie Automation" wale run ke BAAD chalao (usme full movie Drive
# me upload hoti hai) — ya jab bhi Reels dobara banane hon. Agar
# Drive me movie_processed.mp4 nahi mili to run saaf error ke saath
# ruk jayega.
#
# Kyun alag workflow? GitHub ka ek job zyada se zyada 6 ghante chal
# sakta hai. 2 ghante ki movie ka process (~4-5 ghante) + Reels
# banana (~2 ghante) ek job me 6 ghante se zyada ho jata hai — pichhli
# baar Reels wala step "The operation was canceled" keh kar beech me
# hi ruk gaya tha. Isliye Reels ka kaam alag job me hota hai.
#
# Drive connect karne ke wahi 2 tareeke hain jo Movie Automation me
# hain (rclone config pehle, service account baad me) — wahi secrets
# use hote hain, dobara kuch daalne ki zaroorat nahi.
#
# IMPORTANT: GitHub `secrets` ko step ke `if:` me use karne nahi
# deta (error: "Unrecognized named-value: 'secrets'"). Isliye neeche
# secrets ko pehle job ke `env:` me daala gaya hai (HAS_SA,
# HAS_RCLONE), aur steps sirf `env.HAS_...` par check karte hain.
# `if:` wali lines me kabhi `secrets.` mat likho.

on:
  workflow_dispatch:
    inputs:
      movie_file:
        description: "Drive me processed file ka naam (MovieEdit folder me)"
        required: false
        default: "movie_processed.mp4"
        type: string

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HAS_SA: ${{ secrets.GDRIVE_SA_JSON != '' }}
      HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
    steps:
      - name: Files lao (repo se script)
        uses: actions/checkout@v4

      - name: Server par jagah khali karo (pehle se)
        run: |
          df -h
          # GitHub ke server par pehle se bade tools pade hote hain jo
          # humein chahiye hi nahi (dotnet, ghc, boost, android SDK).
          # Inhe hata kar ~10 GB jagah milti hai.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          df -h

      - name: ffmpeg check karo (na ho to install karo)
        run: |
          which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: rclone install karo
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Google Drive connect karo (service account)
        if: ${{ env.HAS_SA == 'true' && env.HAS_RCLONE != 'true' }}
        env:
          SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$SA_JSON" > sa.json
          printf '[gdrive]\ntype = drive\nscope = drive\nservice_account_file = sa.json\nroot_folder_id = %s\n' "$FOLDER_ID" > ~/.config/rclone/rclone.conf
          echo "UPLOAD_TARGET=gdrive:/" >> "$GITHUB_ENV"
          rclone lsd gdrive: --max-depth 1

      - name: Google Drive connect karo (rclone config)
        if: ${{ env.HAS_RCLONE == 'true' }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "UPLOAD_TARGET=gdrive:MovieEdit/" >> "$GITHUB_ENV"
          rclone lsd gdrive: --max-depth 1

      - name: Processed movie Drive se download karo
        run: |
          if [ -z "$UPLOAD_TARGET" ]; then echo "Drive connect nahi hua — GDRIVE_SA_JSON + GDRIVE_FOLDER_ID ya RCLONE_CONFIG secret check karo."; exit 1; fi
          if ! rclone lsf "${UPLOAD_TARGET}${{ inputs.movie_file }}" >/dev/null 2>&1; then
            echo "Drive me ${{ inputs.movie_file }} nahi mili ($UPLOAD_TARGET) — pehle Movie Automation workflow 'both' (default) ya 'full' se chalao, phir ye workflow chalao."
            exit 1
          fi
          rclone copy "${UPLOAD_TARGET}${{ inputs.movie_file }}" . --retries 3
          ls -lh "${{ inputs.movie_file }}"

      - name: Reels banao aur Drive me upload karo
        run: |
          if [ -z "$UPLOAD_TARGET" ]; then echo "Drive connect nahi hua — GDRIVE_SA_JSON + GDRIVE_FOLDER_ID ya RCLONE_CONFIG secret check karo."; exit 1; fi
          df -h
          # Sirf 9:16 vertical Reels wale parts bante hain — 16:9 wale
          # (post wale) parts bilkul nahi bante. Length wahi 2-2 minute.
          BASE="${{ inputs.movie_file }}"
          STEM="${BASE%.mp4}"
          python3 movie_automation.py --split-only "$BASE" --parts 120 --vertical-parts --reels-only
          rclone copy "${STEM}_parts_vertical" "${UPLOAD_TARGET}reels/" --retries 3

      - name: Server se sab delete karo
        if: always()
        run: |
          BASE="${{ inputs.movie_file }}"
          STEM="${BASE%.mp4}"
          rm -f "$BASE" sa.json
          rm -rf "${STEM}_parts" "${STEM}_parts_vertical"
          ls -la
          echo "Server se movie aur Reels delete kar diye."
